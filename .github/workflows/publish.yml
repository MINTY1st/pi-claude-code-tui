name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - run: node scripts/release-guard.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: mkdir release && npm pack --ignore-scripts --pack-destination release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release
      - name: Publish verified tarball using npm Trusted Publishing
        run: |
          packages=(release/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --provenance --ignore-scripts
